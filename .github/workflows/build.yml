name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw --batch-mode clean verify
      - name: Package portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Type app-image
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Elektro-Windows-portable
          path: dist/windows-app-image/Elektro/
          if-no-files-found: error
